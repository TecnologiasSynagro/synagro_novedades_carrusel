<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades - Synagro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">
                <img src="./logo.jpeg" alt="Synagro" title="Synagro">
            </a>
        </div>
    </header>

    <div class="carousel-container">
        <div class="carousel">
            <div class="carousel-slides" id="carouselSlides">
                <!-- Las diapositivas se generan dinámicamente desde JavaScript -->
            </div>

            <!-- Botones de navegación -->
            <button class="carousel-button carousel-button-prev" id="prevBtn" aria-label="Diapositiva anterior">
                <span>&#10094;</span>
            </button>
            <button class="carousel-button carousel-button-next" id="nextBtn" aria-label="Siguiente diapositiva">
                <span>&#10095;</span>
            </button>
        </div>

        <!-- Indicadores de posición -->
        <div class="carousel-indicators" id="indicators"></div>

        <!-- Información de la diapositiva actual -->
        <div class="carousel-info">
            <h1 id="slideTitle"></h1>
            <p id="slideDescription"></p>
            <a href="#" id="slideLink" class="carousel-cta-button">Conocer más</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
